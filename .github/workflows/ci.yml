name: YourSite CI/CD
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Using Node 22 for Next 15+

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.27.0 # Explicitly pinning to the version in packageManager

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run Build
        run: pnpm build
        env:
          # Default V8 old-space ceiling (~2GB) OOMs mid-typecheck on this repo's
          # size; ubuntu-latest runners have 16GB, so give the build room.
          NODE_OPTIONS: --max-old-space-size=6144
